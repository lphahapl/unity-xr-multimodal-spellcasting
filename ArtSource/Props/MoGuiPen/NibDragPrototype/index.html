<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨规笔 · 笔锋拖弯样板</title>

<style>
*{box-sizing:border-box}body{margin:0;background:#111a20;color:#e8e7dd;font:15px/1.5 'Microsoft YaHei',sans-serif}header{padding:20px 28px 12px;border-bottom:1px solid #34434b}h1{font-size:25px;margin:0 0 5px}p{margin:4px 0;color:#aebdc4}.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:14px 28px}button,select{background:#253741;color:#f0eee3;border:1px solid #526672;border-radius:5px;padding:7px 13px;font:inherit}input[type=range]{width:120px;vertical-align:middle}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 20px}.card{background:#18262f;border:1px solid #3b4c57;border-radius:7px;overflow:hidden}.card h2{font-size:17px;margin:12px 16px 4px}.card p{font-size:12px;margin:0 16px 10px;min-height:36px}canvas{display:block;width:100%;height:420px}.metrics{font:13px/1.6 Consolas,'Microsoft YaHei',sans-serif;padding:10px 16px;min-height:78px;background:#14212a}.footer{margin:16px 28px;color:#c8c5af}#phase{color:#f5ca87}#scrub{width:300px}.badge{font-size:12px;background:#6a4d28;color:#ffe6b8;border-radius:4px;padding:3px 7px;margin-left:8px}#status{font-size:13px;padding:0 28px 15px;color:#adc2cf}@media(max-width:900px){.cards{grid-template-columns:1fr}canvas{height:320px}}
</style></head><body><header><h1>墨规笔 · 笔锋反向拖弯<span class="badge">独立样板 · 尚未接入游戏</span></h1><p>T-21 原网格与贴图。三栏使用同一条 Nib 轨迹；墨迹落点保持一致。</p></header>
<div class="controls"><button id="play">暂停</button><button id="restart">重新播放</button><label>动作 <select id="scenario"><option value="line">往返、停笔、抬笔</option><option value="corner">直角转向</option><option value="circle">圆形运笔</option><option value="normal">只沿板面法线压入</option><option value="loss">失追与重新接触</option></select></label><label>视角 <select id="view"><option value="close">笔锋近看</option><option value="whole">整笔</option></select></label><label>板面 <select id="board"><option value="0">正面</option><option value="45">旋转 45°</option></select></label><label>最大拖弯 <input id="amplitude" type="range" min="0" max="6" step="0.5" value="4.5"><span id="amp">4.5 mm</span></label></div>
<div class="controls"><label>时间 <input id="scrub" type="range" min="0" max="6" step="0.0166667" value="0"></label><span id="phase"></span><label><input id="markers" type="checkbox" checked> 显示 Nib 落点与运动方向</label></div>
<div class="cards"><section class="card"><h2>A · 原版刚性笔锋</h2><p>原网格静止形状，作为形变前对照。</p><canvas id="a"></canvas><div class="metrics" id="ma"></div></section><section class="card"><h2>B · 落点约束拖弯</h2><p>笔锋中段反向弯，锋根与接触尖端固定。待用户审阅。</p><canvas id="b"></canvas><div class="metrics" id="mb"></div></section><section class="card"><h2>C · 自由锋尖对照</h2><p>尖端也反向摆动，展示它与逻辑落点分离的程度。</p><canvas id="c"></canvas><div class="metrics" id="mc"></div></section></div>
<div class="footer">青色点＝逻辑 Nib / 墨迹端点；金色箭头＝板面内移动方向。每栏笔杆、Nib 与识别输入完全相同。</div><div id="status">正在加载原模型…</div><script type="module" src="preview.mjs"></script></body></html>
