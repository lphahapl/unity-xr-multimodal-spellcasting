<div class="metrics" id="metrics"></div><div class="toolbar"><input type="search" id="search" placeholder="搜索需求名称或编号" aria-label="搜索交付需求"><select id="stage-filter" aria-label="筛选交付阶段"><option>全部阶段</option><option>待实现</option><option>开发中</option><option>待验收</option><option>已验收</option></select><label>演示角色<select id="actor"><option>需求方</option><option>实现方</option></select></label><span class="badge accent" id="baseline"></span></div><div class="split"><section class="card" id="requirements"><div class="sectionbar"><h2>需求与交付清单</h2><small>每条需求都有当前验收标准</small></div><div id="requirement-list"></div><p class="footnote">已确认变更会更新对应需求基线并要求重新交付；旧标准、证据和处理理由保留在记录中。</p></section><aside><section class="card" id="changes"><div class="sectionbar"><h2>范围变更</h2><small id="change-count"></small></div><div id="change-list"></div></section><section class="card"><div class="sectionbar"><h2>验收前要确认什么</h2><small>三个检查条件</small></div><div class="gate"><span>当前需求基线已有交付证据</span><span>该需求没有未关闭的阻断问题</span><span>该需求没有待确认的范围变更</span></div><p class="footnote">角色仅为流程演示，实际多人使用需账号权限与服务端状态校验。</p></section></aside></div><section class="card" id="issues"><div class="sectionbar"><h2>问题与复验</h2><small>修复提交后，仍需需求方复验才能关闭</small></div><div class="tablewrap"><table><thead><tr><th>编号 / 需求</th><th>级别</th><th>问题描述</th><th>处理状态</th><th>操作</th></tr></thead><tbody id="issue-rows"></tbody></table></div></section><section class="card" id="records"><div class="sectionbar"><h2>最近交付记录</h2><small>完整说明与证据随 JSON 导出</small></div><ul class="history" id="history"></ul></section>
