<div class="metrics" id="metrics"></div><section id="tasks"><div class="sectionbar"><h2>任务看板</h2><small>完成需要负责人提交版本、指定复核人确认</small></div><div class="toolbar"><input type="search" id="search" aria-label="搜索任务" placeholder="搜索任务名称或编号"><select id="owner-filter" aria-label="按负责人筛选"></select><label>演示记录人<select id="actor" aria-label="演示记录人"></select></label><label>参照日期<input id="clock" type="date" aria-label="任务参照日期"><button id="set-clock" class="small">应用</button></label></div><div id="board" class="board"></div></section><div class="split section-gap"><section class="card" id="contributions"><div class="sectionbar"><h2>贡献记录</h2><small>记录事实，不自动生成贡献分数</small></div><div class="tablewrap"><table><thead><tr><th>成员称呼</th><th class="num">负责任务</th><th class="num">提交版本</th><th class="num">通过复核</th><th class="num">退回修改</th></tr></thead><tbody id="members"></tbody></table></div><p class="footnote">版本和复核记录帮助讨论分工；数量不直接代表工作价值，也不作为成绩结论。</p></section><section class="card" id="records"><div class="sectionbar"><h2>最近操作</h2><small>完整记录随 JSON 备份导出</small></div><ul class="history" id="history"></ul></section></div>
