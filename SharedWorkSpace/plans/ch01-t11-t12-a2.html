用户原截图"></a></details><p><a href="/plans/?id=ch01-t11-a2#body">填写本处批注</a></p></section><section id="T12"><h2>T-12 A2 · 明渠外端的院门楼</h2><p>撤掉整个穿堂门楼，从两端接起院墙。远山仍可越墙看到，玩家沿院内铺地横走。效果图中的低排水箅与石草为拟议细节。</p><h3>目标效果</h3><a href="/assets/30a8251b14ce8baeedee85168a0e59f22fdf931ae83082c71158b9786f59eff4/T12_A2_%E9%99%A2%E5%A2%99%E6%94%B6%E5%8F%A3.png"><img src="/assets/30a8251b14ce8baeedee85168a0e59f22fdf931ae83082c71158b9786f59eff4/T12_A2_%E9%99%A2%E5%A2%99%E6%94%B6%E5%8F%A3.png" alt="玩家眼高效果图"></a><h3>Unity 同一眼位</h3><a href="/assets/e21cf9384b67e7f3ceca6de37a951d0c04f0bd7c943426eef84405f690ad46bb/T12_A2_%E5%90%8C%E6%9C%BA%E4%BD%8D%E5%AE%9E%E6%8B%8D.jpg"><img src="/assets/e21cf9384b67e7f3ceca6de37a951d0c04f0bd7c943426eef84405f690ad46bb/T12_A2_%E5%90%8C%E6%9C%BA%E4%BD%8D%E5%AE%9E%E6%8B%8D.jpg" alt="正式场景原状与隔离试摆"></a><details><summary>查看你指认的原方向</summary><a href="/assets/ae32836d8c9d689f249c51381487528fe4a51b227649ca852773013b453e2306/T12_%E7%94%A8%E6%88%B7%E6%8C%87%E8%AE%A4%E6%96%B9%E5%90%91.png"><img src="/assets/ae32836d8c9d689f249c51381487528fe4a51b227649ca852773013b453e2306/T12_%E7%94%A8%E6%88%B7%E6%8C%87%E8%AE%A4%E6%96%B9%E5%90%91.png" alt="用户原截图"></a></details><p><a href="/plans/?id=ch01-t12-a2#body">填写本处批注</a></p></section></main></html>
