<body><main>

      <option value="Unity_Images_02_NearHand_Front45_1to1.png">R02 · Unity 近手</option>

<p><strong>当前审阅阶段</strong>　用户已授权出稿。主榫和③取用台分别审阅；④中控原方孔保留。下方旧稿供参照。</p>
<p id="fit"><strong>R02 物件回归</strong>　106 mm 方插端在④原方孔完成四向插入和一次重插，共五次。样板插深约 104 mm，正确路径逐帧最大检测穿透为零。</p>
<p><strong>独立中层切片</strong>　使用 R01 样件的 28 项桌面验证覆盖工坊清场、拾取、坐实启机与读档。R02 的正式章节接入及头显握取仍待验。</p>

</main>
<script type="module">
const base = '/assets/workshop-master-tenon-r02/';
const descriptions = [
  '对照 A1 检查 R02 的玉色、环纹、刻线和收窄插端。灰手为尺寸参照。',
  'R02 冻结网格与内嵌 PBR 贴图。可用滑杆转动模型。',
  '同一网格与贴图，在中性侧光下观察玉面起伏与反光。',
  '④既有中控的真实孔口，供观察边缘与插入方向。',
  'R02 在④真实孔型中坐实后的独立 Unity 样板。',
  'R01 参考实拍，与当前 R02 近手图使用相同机位及中性照明。',
  '道具会话的独立几何小样。两枚压挡从座上覆盖榫顶边缘，外观和机制待批。',
  '同机位、同一把榫。两枚压挡退开，露出向上取出的路径。'
];
const byId = id => document.getElementById(id);
const view = byId('view'), model = byId('model'), photo = byId('photo'), canvas = model.querySelector('canvas');
if (window.parent !== window) byId('commentLink').hidden = true;
let loading;
async function startModel() {
  const T = await import('three');
  const {GLTFLoader} = await import('three/addons/loaders/GLTFLoader.js');
  const gltf = await new GLTFLoader().loadAsync(base + 'MasterTenon_R02.glb');
  const renderer = new T.WebGLRenderer({canvas,antialias:true});
  renderer.setClearColor(0x151c1e);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1,2));
  const scene = new T.Scene();
  const bounds = new T.Box3().setFromObject(gltf.scene);
  const pivot = new T.Group();
  gltf.scene.position.sub(bounds.getCenter(new T.Vector3()));
  pivot.add(gltf.scene); scene.add(pivot);
  const radius = bounds.getBoundingSphere(new T.Sphere()).radius;
  const camera = new T.PerspectiveCamera(33,1,radius / 50,radius * 20);
  scene.add(new T.HemisphereLight(0xffffff,0x929999,1.35));
  const key = new T.DirectionalLight(0xffffff,1.9);
  key.position.set(3,4,2); scene.add(key);
  function draw() {
    const width = model.clientWidth, height = model.clientHeight;
    if (!width || !height) return;
    renderer.setSize(width,height,false); camera.aspect = width / height;
    const angle = Math.min(camera.fov * Math.PI / 360, Math.atan(camera.aspect * Math.tan(camera.fov * Math.PI / 360)));
    camera.position.set(0.58,0.32,1).setLength(1.06 * radius / Math.sin(angle));
    camera.lookAt(0,0,0); camera.updateProjectionMatrix();
    pivot.rotation.y = Number(byId('yaw').value) * Math.PI / 180;
    renderer.render(scene,camera);
  }
  byId('yaw').addEventListener('input', draw);
  new ResizeObserver(draw).observe(model);
  draw();
}
function selectView() {
  const rotate = view.value === 'glb';
  byId('still').hidden = rotate; model.hidden = !rotate; byId('turn').hidden = !rotate;
  byId('caption').textContent = descriptions[view.selectedIndex];
  if (!rotate) {
    const folder = view.selectedOptions[0].dataset.version === 'r01' ? '/assets/workshop-master-tenon-r01/' : base;
    photo.src = byId('still').href = folder + view.value;
    photo.alt = view.selectedOptions[0].textContent;
    return;
  }
  if (!loading) {
    byId('failure').textContent = '正在载入 R02…';
    loading = startModel().then(() => {byId('failure').hidden = true;}).catch(() => {
      canvas.hidden = true;
      byId('turn').hidden = true;
      byId('failure').textContent = '当前浏览器无法绘制模型，可切换 Unity 实拍或';
      const a = document.createElement('a');
      a.href = base + 'MasterTenon_R02.glb'; a.textContent = '打开原始 GLB'; byId('failure').append(a);
      loading = null;
    });
    canvas.hidden = false;
  }
}
view.addEventListener('change', selectView);
selectView();
</script>
