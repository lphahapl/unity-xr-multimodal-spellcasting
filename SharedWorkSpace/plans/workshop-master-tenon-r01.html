    </style><header><small>第二章 · 独立重要道具 / R01 待批注</small><h1>汉白玉校准主榫</h1><p>③工坊取回，带回④中控插到位。主榫与玩家杂物分开审阅，当前为独立样板。</p><nav><a href="/rig/?collection=workshop-master-tenon&model=master-tenon-r01">旋转模型与版本批注</a><a href="/">工作空间首页</a></nav></header>
    <p class="note">请重点看玉身是否温润、铜件是否克制、刻线近手是否清楚，以及插入端和握位的比例。正式章节尚未替换，头显舒适性及真人握持待验。</p><main><figure><a href="/assets/workshop-master-tenon-r01/Reference_Zone4.png" target="_blank"><img loading="lazy" src="/assets/workshop-master-tenon-r01/Reference_Zone4.png" alt="④ 中控原设"></a><figcaption><strong>④ 中控原设</strong><p>图2是回插插座参考。原图“阴刻”是工艺占位，初稿改用云雷纹与度量刻线。</p></figcaption></figure><figure><a href="/assets/workshop-master-tenon-r01/Blender_01_Front45.png" target="_blank"><img loading="lazy" src="/assets/workshop-master-tenon-r01/Blender_01_Front45.png" alt="R01 · 正侧近景"></a><figcaption><strong>R01 · 正侧近景</strong><p>温白玉身、半哑光表面；暗铜嵌箍收在120毫米外廓内。可点击原图放大。</p></figcaption></figure><figure><a href="/assets/workshop-master-tenon-r01/Design_A1_Candidate.png" target="_blank"><img loading="lazy" src="/assets/workshop-master-tenon-r01/Design_A1_Candidate.png" alt="A1 · 玉料刻纹与双销设计候选"></a><figcaption><strong>A1 · 玉料刻纹与双销设计候选</strong><p>本轮新增、尚未定稿。图示下端收颈与台座侧销不同于R01整宽方榫及顶缘压挡小样；以实际④方孔配合为准，不按图中透视修改已测尺寸。</p></figcaption></figure><figure><a href="/assets/workshop-master-tenon-r01/Neutral_01_NearHand_Front45_Neutral.png" target="_blank"><img loading="lazy" src="/assets/workshop-master-tenon-r01/Neutral_01_NearHand_Front45_Neutral.png" alt="Unity · 1∶1近手对照"></a><figcaption><strong>Unity · 1∶1近手对照</strong><p>真实米制尺寸，中性灯光保留PBR；旁侧手模为比例参照。目前尚未接Meta/XR抓取事件。</p></figcaption></figure><figure><a href="/assets/workshop-master-tenon-r01/Unity_03_BackSide_1to1.png" target="_blank"><img loading="lazy" src="/assets/workshop-master-tenon-r01/Unity_03_BackSide_1to1.png" alt="Unity · 侧背"></a><figcaption><strong>Unity · 侧背</strong><p>检查完整侧背、上下端和拿取时的可读性。</p></figcaption></figure><figure><a href="/assets/workshop-master-tenon-r01/Blender_07_SideLightJade.png" target="_blank"><img loading="lazy" src="/assets/workshop-master-tenon-r01/Blender_07_SideLightJade.png" alt="玉身侧光"></a><figcaption><strong>玉身侧光</strong><p>离线材质近景；运行时采用不透明PBR表面表现。</p></figcaption></figure><figure><a href="/assets/workshop-master-tenon-r01/Blender_08_BronzeWear.png" target="_blank"><img loading="lazy" src="/assets/workshop-master-tenon-r01/Blender_08_BronzeWear.png" alt="旧铜与接触刻度"></a><figcaption><strong>旧铜与接触刻度</strong><p>刻槽、铜玉交界与接触磨损；没有扩大握头或铜肩。</p></figcaption></figure><figure><a href="/assets/workshop-master-tenon-r01/Unity_06_ActualSocketTop_EmptyOpening.png" target="_blank"><img loading="lazy" src="/assets/workshop-master-tenon-r01/Unity_06_ActualSocketTop_EmptyOpening.png" alt="正式槽资源 · 空口"></a><figcaption><strong>正式槽资源 · 空口</strong><p>独立副本读取原ConsoleSocket。资料标称146毫米；当前网格扫描约153毫米，未扩大孔。</p></figcaption></figure><figure><a href="/assets/workshop-master-tenon-r01/Neutral_03_Inserted_Front45_Neutral.png" target="_blank"><img loading="lazy" src="/assets/workshop-master-tenon-r01/Neutral_03_Inserted_Front45_Neutral.png" alt="正式槽资源 · 实插"></a><figcaption><strong>正式槽资源 · 实插</strong><p>同一120毫米主榫，中性照明，样板插深约104毫米；此插深为实测装配选择，不是原设指定值。</p></figcaption></figure><figure><a href="/assets/workshop-master-tenon-r01/Unity_09_Inserted_Side.png" target="_blank"><img loading="lazy" src="/assets/workshop-master-tenon-r01/Unity_09_Inserted_Side.png" alt="实插侧视"></a><figcaption><strong>实插侧视</strong><p>碰撞体始终开启；正确四向及重复插入通过。错转45°、偏位和过深有独立检查。</p></figcaption></figure><figure><a href="/assets/workshop-master-tenon-r01/Reference_Zone3.png" target="_blank"><img loading="lazy" src="/assets/workshop-master-tenon-r01/Reference_Zone3.png" alt="③ 工坊取用处 · 原稿尺寸"></a><figcaption><strong>③ 工坊取用处 · 原稿尺寸</strong><p>主榫120×120×350毫米，展示座850×850×650毫米。图内旧30米距离已由V2.4的院内8米替代；持榫返④总返程34.4米。</p></figcaption></figure><figure><a href="/assets/workshop-master-tenon-r01/Blender_09_LowSameView.png" target="_blank"><img loading="lazy" src="/assets/workshop-master-tenon-r01/Blender_09_LowSameView.png" alt="低模同机位"></a><figcaption><strong>低模同机位</strong><p>LOD0 720三角，刻纹由高模烘焙法线表现。</p></figcaption></figure><figure><a href="/assets/workshop-master-tenon-r01/Blender_10_HighSameView.png" target="_blank"><img loading="lazy" src="/assets/workshop-master-tenon-r01/Blender_10_HighSameView.png" alt="高模同机位"></a><figcaption><strong>高模同机位</strong><p>343616三角，可编辑高模和烘焙设置均保留。</p></figcaption></figure><figure><a href="/assets/workshop-master-tenon-r01/Proposal_01_Closed_TopEdgeStops.png" target="_blank"><img loading="lazy" src="/assets/workshop-master-tenon-r01/Proposal_01_Closed_TopEdgeStops.png" alt="新增提案 · 闭合压挡"></a><figcaption><strong>新增提案 · 闭合压挡</strong><p>座上两销压挡顶缘，退开后可取。原稿没有这一锁定机制；这里只是独立机械/视觉小样，未接清场或正式抓取限制。</p></figcaption></figure><figure><a href="/assets/workshop-master-tenon-r01/Proposal_02_Retracted_ClearTop.png" target="_blank"><img loading="lazy" src="/assets/workshop-master-tenon-r01/Proposal_02_Retracted_ClearTop.png" alt="新增提案 · 退开露出握位"></a><figcaption><strong>新增提案 · 退开露出握位</strong><p>座上两销压挡顶缘，退开后可取。原稿没有这一锁定机制；这里只是独立机械/视觉小样，未接清场或正式抓取限制。</p></figcaption></figure></main><footer>原设：V2.1阶段稿与双战区尺寸；距离按V2.4。只有带回④并插到位，才进入原设的冰蓝启机状态。清场退销机制单独作为新增提案。</footer></html>
