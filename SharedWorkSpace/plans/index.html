<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>策划案工作台</title>
    <script src="../ui/open.js" data-route="plans/"></script>
    <link rel="stylesheet" href="/ui/base.css" />
  </head>
  <body>
    <nav aria-label="工作台导航">
      <a href="/">共享工作空间</a><a href="/rig/">骨骼与动画</a><a href="/plans/">策划案</a
      ><a href="/scenes/">场景原型</a><a href="/reader/">配置与检索</a>
    </nav>
    <main>
      <div class="heading">
        <h1>策划案工作台</h1>
        <div class="tools">
          <button id="reload">重新读取文件</button><button id="new" class="primary">新建策划案</button>
        </div>
      </div>
      <div class="layout">
        <aside class="pane">
          <label class="field">查找策划案<input type="search" id="filter" /></label>
          <div id="list" class="sidebar"></div>
        </aside>
        <form class="pane" id="editor" hidden>
          <label class="field" for="name">名称<input id="name" required maxlength="240" /></label
          ><label class="field" for="summary">摘要<textarea id="summary" rows="2"></textarea></label
          ><label class="field" for="planStatus"
            >状态<input id="planStatus" list="statuses" required /><datalist id="statuses">
              <option>草稿</option>
              <option>审阅中</option>
              <option>已确认</option>
              <option>参考</option>
            </datalist></label
          >
          <div id="reviewPreview" hidden></div>
          <label class="field" for="body">策划正文<textarea id="body" rows="13"></textarea></label>
          <div class="tools">
            <button class="primary" id="save">保存到文件</button
            ><button class="danger" id="delete" type="button">删除记录</button><a id="raw">查看 JSON</a>
          </div>
          <div class="path" id="path"></div>
        </form>
      </div>
      <p id="status" class="status" role="status"></p>
      <p id="errors" class="status" role="alert"></p>
    </main>
    <script type="module" src="/ui/editor.js"></script>
  </body>
</html>
